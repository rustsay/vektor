<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Тестовый канал – Telegram</title></head>
<body>
<div class="tgme_channel_info">
  <div class="tgme_channel_info_header">
    <div class="tgme_channel_info_header_title"><span dir="auto">Тестовый канал</span></div>
    <div class="tgme_channel_info_header_username"><a href="https://t.me/testchan">@testchan</a></div>
  </div>
  <div class="tgme_channel_info_counters">
    <div class="tgme_channel_info_counter"><span class="counter_value">12.3K</span> <span class="counter_type">subscribers</span></div>
    <div class="tgme_channel_info_counter"><span class="counter_value">340</span> <span class="counter_type">photos</span></div>
  </div>
</div>
<section class="tgme_channel_history js-message_history">
  <div class="tgme_widget_message_wrap js-widget_message_wrap">
    <div class="tgme_widget_message text_not_supported_wrap js-widget_message" data-post="testchan/101" data-view="x">
      <div class="tgme_widget_message_bubble">
        <a class="tgme_widget_message_photo_wrap" href="https://t.me/testchan/101" style="width:800px"></a>
        <div class="tgme_widget_message_text js-message_text" dir="auto">Первая строка<br/>Вторая строка про <b>нейросети</b></div>
        <div class="tgme_widget_message_reactions js-message_reactions">
          <span class="tgme_reaction"><i class="emoji"><b>👍</b></i>1.2K</span>
          <span class="tgme_reaction"><i class="emoji"><b>🔥</b></i>35</span>
        </div>
        <div class="tgme_widget_message_footer compact js-message_footer">
          <div class="tgme_widget_message_info short js-message_info">
            <span class="tgme_widget_message_views">4.5K</span><span class="copyonly"> views</span>
            <span class="tgme_widget_message_meta"><a class="tgme_widget_message_date" href="https://t.me/testchan/101"><time datetime="2026-10-20T15:30:00+00:00" class="time">18:30</time></a></span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="tgme_widget_message_wrap js-widget_message_wrap">
    <div class="tgme_widget_message js-widget_message" data-post="testchan/102">
      <div class="tgme_widget_message_bubble">
        <a class="tgme_widget_message_reply" href="https://t.me/testchan/101">
          <div class="tgme_widget_message_text js-message_reply_text" dir="auto">Цитата из ответа</div>
        </a>
        <div class="tgme_widget_message_video_player js-message_video_player"></div>
        <div class="tgme_widget_message_text js-message_text" dir="auto">Видео с разбором</div>
        <div class="tgme_widget_message_footer">
          <div class="tgme_widget_message_info">
            <span class="tgme_widget_message_views">987</span>
            <span class="tgme_widget_message_meta"><a class="tgme_widget_message_date" href="https://t.me/testchan/102"><time datetime="2026-10-21T09:05:00+00:00" class="time">12:05</time></a></span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="tgme_widget_message_wrap js-widget_message_wrap">
    <div class="tgme_widget_message service_message js-widget_message" data-post="testchan/103">
      <div class="tgme_widget_message_bubble"><div class="tgme_widget_message_text js-message_text">Channel photo updated</div>
        <a class="tgme_widget_message_date" href="#"><time datetime="2026-10-22T09:05:00+00:00">12:05</time></a></div>
    </div>
  </div>
</section>
</body></html>
